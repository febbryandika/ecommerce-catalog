name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # Mirrors docker-compose.yml, minus the 5437 port remap — nothing else is listening here,
    # so the container keeps the default 5432.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_catalog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce_catalog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_catalog
      # The E2E suite runs against its own database and wipes it before every run
      # (e2e/global-setup.ts). Naming it explicitly rather than letting playwright.config.ts
      # derive it keeps the two environments on the same code path.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_catalog_e2e
      BETTER_AUTH_SECRET: ci-secret-not-used-outside-this-job
      # playwright.config.ts overrides this for the server it starts; the value here is what the
      # non-E2E steps see.
      BETTER_AUTH_URL: http://localhost:3000
      # No R2_* on purpose: the upload round-trip test skips itself rather than failing, and a
      # build with them absent is the check that the S3 client is built lazily (src/lib/r2.ts).

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm format:check

      - run: pnpm test

      - run: pnpm db:migrate

      - run: pnpm db:seed

      # Idempotency is the seed's headline property (SPEC 10) and the easiest one to break
      # without noticing, so the second run has to prove it rather than merely survive: the
      # summary must report nothing new in any of the three groups. No R2_* in this job, so
      # the image step skips itself and nothing reaches a bucket.
      - name: Seeding twice must be a no-op
        run: |
          set -eo pipefail
          pnpm db:seed | tee "$RUNNER_TEMP/seed-rerun.log"
          grep -qE 'categories \(0 new\).*products \(0 new\).*accounts \(0 new\)' \
            "$RUNNER_TEMP/seed-rerun.log"

      # Chromium only — playwright.config.ts defines a single chromium project.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      # playwright-report/ only exists because playwright.config.ts now registers the html
      # reporter — with the previous `reporter: 'list'` nothing wrote that directory and this
      # step uploaded an empty artifact, which is why a red CI run left no trace to open.
      # test-results/ carries the traces themselves (trace: 'on-first-retry').
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
